<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AppliedIn</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><img src="../icons/icon48.png" alt="" width="26" height="26" /><span>AppliedIn</span></div>
    <div class="top-r">
      <span id="totalCount" class="pill">0 total</span>
      <button id="btnBoard" class="ghost" type="button" title="Open full dashboard with board and insights">Dashboard</button>
      <button id="btnSettings" class="icon" type="button" aria-label="Settings" title="Settings">⚙</button>
    </div>
  </header>

  <section class="goal" aria-label="Daily goal">
    <div class="goal-t"><span id="goalText"></span><span id="streakText"></span></div>
    <div class="meter"><i id="goalFill"></i></div>
  </section>

  <button id="attention" class="strip warn" type="button" hidden></button>
  <button id="pendingStrip" class="strip warn" type="button" hidden></button>
  <button id="backupWarn" class="strip" type="button" hidden></button>

  <section class="stats">
    <div class="stat"><b id="statToday">0</b><span>Today</span></div>
    <div class="stat"><b id="statWeek">0</b><span>This week</span></div>
    <div class="stat"><b id="statMonth">0</b><span>This month</span></div>
    <div class="stat" id="statReplyBox" title="Companies that replied (shortlisted, interview, offer, rejected). Updated by you, by portal pages, or by Gmail detection."><b id="statResp">0</b><span id="statRespLbl">Replies</span></div>
  </section>

  <div class="search"><input id="searchInput" type="search" placeholder="Search company, role or portal" autocomplete="off" /></div>
  <nav class="chips" id="chips" aria-label="Filter by status"></nav>

  <main id="list" class="list"></main>
  <div id="empty" class="empty" hidden>
    <div class="empty-t">Nothing here yet</div>
    <p id="emptyMsg">Apply on LinkedIn, Naukri or Internshala and your applications appear here automatically. You can also add one by hand.</p>
  </div>

  <footer class="bottom">
    <button id="btnAdd" class="primary" type="button">+ Add job</button>
    <button id="btnCsv" type="button">CSV</button>
    <button id="btnExcel" type="button">Excel</button>
    <button id="btnMore" class="icon" type="button" aria-haspopup="menu" aria-label="More options">⋯</button>
  </footer>

  <div id="menu" class="menu" role="menu" hidden>
    <button id="mBackup" role="menuitem" type="button">Back up all data (JSON)</button>
    <button id="mRestore" role="menuitem" type="button">Restore from backup</button>
    <button id="mBoard" role="menuitem" type="button">Open dashboard</button>
  </div>
  <input type="file" id="fileRestore" accept="application/json,.json" hidden />

  <!-- Add job -->
  <div class="overlay" id="addModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="addTitle">
      <div class="modal-h"><h2 id="addTitle">Add a job</h2><button class="icon" id="addClose" type="button" aria-label="Close">✕</button></div>
      <div class="modal-b">
        <label for="addCompany">Company</label><input id="addCompany" maxlength="100" />
        <label for="addRole">Job role</label><input id="addRole" maxlength="140" />
        <div class="two">
          <div><label for="addLocation">Location</label><input id="addLocation" maxlength="100" /></div>
          <div><label for="addSalary">Salary or stipend</label><input id="addSalary" maxlength="80" /></div>
        </div>
        <label for="addResume">Resume used</label><input id="addResume" list="resumeList" maxlength="80" placeholder="e.g. Resume v2 – Data Analyst" />
        <datalist id="resumeList"></datalist>
        <label for="addUrl">Job link</label>
        <div class="inline"><input id="addUrl" type="url" maxlength="500" /><button id="useTab" type="button" class="small">Use this tab</button></div>
        <div class="two">
          <div><label for="addPlatform">Portal</label>
            <select id="addPlatform"><option>LinkedIn</option><option>Naukri</option><option>Internshala</option><option>Indeed</option><option>Glassdoor</option><option>Unstop</option><option>Company Website</option><option selected>Other</option></select></div>
          <div><label for="addStatus">Status</label>
            <select id="addStatus"><option>Applied</option><option>Saved</option><option>In Review</option><option>Shortlisted</option><option>Interview</option><option>Offer</option><option>Rejected</option></select></div>
        </div>
        <p id="addErr" class="err" hidden></p>
      </div>
      <div class="modal-f"><button id="addCancel" type="button">Cancel</button><button id="addForce" type="button" hidden>Add anyway</button><button id="addSave" class="primary" type="button">Save job</button></div>
    </div>
  </div>

  <!-- Export -->
  <div class="overlay" id="exportModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
      <div class="modal-h"><h2 id="exportTitle">Export</h2><button class="icon" id="exportClose" type="button" aria-label="Close">✕</button></div>
      <div class="modal-b">
        <div class="periods" id="periods"></div>
        <p class="muted" id="periodCount"></p>
      </div>
      <div class="modal-f"><button id="exportCancel" type="button">Cancel</button><button id="exportGo" class="primary" type="button">Download</button></div>
    </div>
  </div>

  <!-- Settings -->
  <div class="overlay" id="setModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="setTitle">
      <div class="modal-h"><h2 id="setTitle">Settings</h2><button class="icon" id="setClose" type="button" aria-label="Close">✕</button></div>
      <div class="modal-b settings" id="settingsBox"></div>
      <div class="modal-f"><button id="setDone" class="primary" type="button">Done</button></div>
    </div>
  </div>

  <div id="snack" class="snack" role="status" hidden></div>

  <script src="../lib/shared.js"></script>
  <script src="../lib/store.js"></script>
  <script src="../lib/ui.js"></script>
  <script src="../lib/settingsui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
