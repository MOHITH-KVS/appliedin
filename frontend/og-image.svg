<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A56FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <!-- White card -->
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="white" opacity="0.08"/>
  <!-- Logo area -->
  <circle cx="140" cy="160" r="52" fill="white" opacity="0.15"/>
  <text x="140" y="172" font-family="Arial" font-size="40" text-anchor="middle" fill="white">📋</text>
  <!-- AppliedIn text -->
  <text x="220" y="145" font-family="Arial Black, Arial" font-size="56" font-weight="900" fill="white">AppliedIn</text>
  <text x="220" y="190" font-family="Arial" font-size="24" fill="rgba(255,255,255,0.8)">Free Job Application Tracker</text>
  <!-- Divider -->
  <line x1="100" y1="230" x2="1100" y2="230" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Main tagline -->
  <text x="600" y="310" font-family="Arial" font-size="38" font-weight="700" fill="white" text-anchor="middle">Never forget where you applied.</text>
  <text x="600" y="360" font-family="Arial" font-size="24" fill="rgba(255,255,255,0.85)" text-anchor="middle">Auto-tracks LinkedIn · Naukri · Internshala · Glassdoor · and more</text>
  <!-- Stats -->
  <rect x="100" y="415" width="300" height="90" rx="16" fill="rgba(255,255,255,0.12)"/>
  <text x="250" y="460" font-family="Arial Black" font-size="32" font-weight="900" fill="white" text-anchor="middle">11+</text>
  <text x="250" y="490" font-family="Arial" font-size="16" fill="rgba(255,255,255,0.8)" text-anchor="middle">Job Portals</text>
  <rect x="450" y="415" width="300" height="90" rx="16" fill="rgba(255,255,255,0.12)"/>
  <text x="600" y="460" font-family="Arial Black" font-size="32" font-weight="900" fill="white" text-anchor="middle">100%</text>
  <text x="600" y="490" font-family="Arial" font-size="16" fill="rgba(255,255,255,0.8)" text-anchor="middle">Free · Private</text>
  <rect x="800" y="415" width="300" height="90" rx="16" fill="rgba(255,255,255,0.12)"/>
  <text x="950" y="460" font-family="Arial Black" font-size="32" font-weight="900" fill="white" text-anchor="middle">0</text>
  <text x="950" y="490" font-family="Arial" font-size="16" fill="rgba(255,255,255,0.8)" text-anchor="middle">Signup Required</text>
  <!-- URL -->
  <text x="600" y="590" font-family="Arial" font-size="20" fill="rgba(255,255,255,0.6)" text-anchor="middle">appliedin.vercel.app</text>
</svg>
